<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oct 20 · Find the Perspective</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='b' cx='35%25' cy='28%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%23d40853'/%3E%3Cstop offset='100%25' stop-color='%239e0038'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='15' fill='url(%23b)'/%3E%3Crect x='7.5' y='7.5' width='49' height='49' rx='12' fill='none' stroke='%23ffd762' stroke-opacity='.42' stroke-width='1.2'/%3E%3Cpolygon points='32,15 15,45 49,45' fill='%2355001c' fill-opacity='.42'/%3E%3Cpolygon points='32,13 15,43 32,35' fill='%23ffd762'/%3E%3Cpolygon points='32,13 49,43 32,35' fill='%23ffc30c'/%3E%3Cpolygon points='15,43 49,43 32,35' fill='%23ff6b93'/%3E%3Cpolyline points='32,13 32,35 15,43' fill='none' stroke='%23fffdf7' stroke-opacity='.55' stroke-width='1' stroke-linejoin='round'/%3E%3Cline x1='32' y1='35' x2='49' y2='43' stroke='%23fffdf7' stroke-opacity='.35' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="envelope-active">
  <!-- Opening Envelope Animation Overlay -->
  <div id="envelope-overlay" role="button" aria-label="Open Birthday Letter">
    <div class="envelope-stage">
      <div class="envelope-wrapper" id="envelope-wrapper">
        <!-- Back of the envelope -->
        <div class="envelope-back"></div>

        <!-- Letter card inside the envelope -->
        <div class="envelope-letter">
          <div class="letter-ornament">
            <span class="tri-dot red"></span>
            <span class="tri-dot pink"></span>
            <span class="tri-dot gold"></span>
          </div>
          <div class="letter-to">To Yihan Lu</div>
          <div class="letter-sub">OCT 20 &nbsp;·&nbsp; FROM RBTREE</div>
        </div>

        <!-- Left, right, and bottom pocket folds -->
        <div class="envelope-pocket-left"></div>
        <div class="envelope-pocket-right"></div>
        <div class="envelope-pocket-bottom"></div>

        <!-- Top 3D rotating flap -->
        <div class="envelope-flap"></div>

        <!-- Crimson & Gold Geometric Wax Seal -->
        <div class="wax-seal" id="wax-seal">
          <svg viewBox="0 0 64 64" width="88" height="88" aria-hidden="true">
            <circle cx="32" cy="32" r="28" fill="#bd0045" stroke="#ffd762" stroke-width="1.5" stroke-dasharray="3 2" />
            <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255, 215, 98, 0.55)" stroke-width="1" />
            <polygon points="32,16 19,41 32,35" fill="#e84f77" />
            <polygon points="32,16 45,41 32,35" fill="#ffc30c" />
            <polygon points="19,41 45,41 32,35" fill="#ffd762" />
          </svg>
        </div>
      </div>

      <div class="envelope-prompt">CLICK TO OPEN</div>
    </div>
  </div>

  <div id="stage-wrapper">
    <div id="game_area" aria-label="3D Perspective Birthday Sculpture"></div>
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>
  </div>

  <div id="alignment-indicator" aria-live="polite">
    <div id="control-hint" class="control-hint">WASD / ARROWS OR DRAG TO MOVE</div>
    <div class="alignment-label">
      <span>ALIGNMENT</span>
      <span id="alignment-pct">0%</span>
    </div>
    <div class="alignment-line-track">
      <div id="alignment-line-fill"></div>
    </div>
  </div>

  <div id="blessing-message" aria-live="polite">
    <div class="blessing-stanza">
      <p class="blessing-line line-1">穿林打叶，过程轰轰烈烈。</p>
      <p class="blessing-line line-2">花开花落，一路上起起跌跌。</p>
      <p class="blessing-line line-3">春夏秋冬明和灭，幕还未谢，好不容易又一年……</p>
    </div>
    <div class="blessing-divider" aria-hidden="true"></div>
    <div class="blessing-stanza">
      <p class="blessing-line line-4">愿新的一岁，仍有热爱，仍有期待，</p>
      <p class="blessing-line line-5">也仍有无数值得庆祝的瞬间。</p>
      <p class="blessing-line line-6">生日快乐！</p>
    </div>
  </div>

  <script src="js/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
